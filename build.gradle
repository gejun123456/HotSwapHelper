buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2/' }
        maven { url 'https://oss.sonatype.org/content/repositories/releases/' }
    }
    // https://github.com/JetBrains/gradle-intellij-plugin/ 关注开发插件版本
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.guardsquare:proguard-gradle:7.3.0"
    }
}

//2.1 插件配置
// 这两个插件是必备
plugins {
    id 'java'
    id 'org.jetbrains.intellij' version '1.14.1'
}

apply plugin: 'kotlin'



group 'com.bruce.plugins'
version '1.2.0'
sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17
compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

repositories {
    mavenCentral()
}

// http://www.jetbrains.org/intellij/sdk/docs/tutorials/build_system/prerequisites.html
// https://plugins.jetbrains.com/docs/intellij/gradle-guide.html  官网gradle构建教程

intellij {
//    插件名称
    pluginName.set('HotSwapHelper')
    // 沙箱目录位置，用于保存IDEA的设置，默认在build文件下面，防止clean，放在根目录下。
    sandboxDir.set("${rootProject.rootDir}/idea-sandbox")
    // 开发环境运行时使用的版本
    version.set('2022.3.3')
    // 社区版
//    type.set('IC')
    // 企业版
    type.set('IU')
    // 各种IDEA版本去这里找
    // https://www.jetbrains.com/intellij-repository/releases
    // 依赖的插件
    plugins.set(['java', 'maven', 'gradle'])
    //Disables updating since-build attribute in plugin.xml
    updateSinceUntilBuild.set(false)
    downloadSources.set(true)
}

runIde {
    //check if jvm args file exist.
    if (file("jvmArgs.txt").exists()) {
        //read jvm args from file.
        jvmArgs(file("jvmArgs.txt").readLines())
    }
}

dependencies {
    // jackson工具
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.9.6'
    // guava工具
//    implementation 'com.google.guava:guava:29.0-jre'
    // velocity支持
//    implementation 'org.apache.velocity:velocity:1.7'

//    implementation fileTree(dir: 'libs', includes: ['*.jar'])

    //add slf4j
//    implementation 'org.slf4j:slf4j-api:1.7.30'

    // groovy支持
//    implementation 'org.codehaus.groovy:groovy:3.0.2'
    // beetl支持
//    implementation 'com.ibeetl:beetl:3.3.0.RELEASE'
    // freemarker支持
//    implementation 'org.freemarker:freemarker:2.3.30'
    // lombok 支持
    compileOnly 'org.projectlombok:lombok:1.18.30'
    compileOnly group: 'com.alibaba', name: 'fastjson', version: '1.2.83'

    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
    // 测试用例
    testImplementation 'junit:junit:4.12'
    //hutool
    implementation 'cn.hutool:hutool-all:5.8.21'
    //xml
    implementation 'org.jdom:jdom2:2.0.6'
    // Apache Commons Compress（支持 ZIP/TAR/GZIP/BZIP2 等）
    implementation 'org.apache.commons:commons-compress:1.26.1'
    // 可选：支持 XZ/LZMA 压缩（如 .tar.xz）
    implementation 'org.tukaani:xz:1.9'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}
compileKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}
compileTestKotlin {
    kotlinOptions {
        jvmTarget = "17"
    }
}
